[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "pg", "cors", "dotenv", "bcryptjs", "jsonwebtoken", "mongoose"]

[[redirects]]
  from = "/api/*"
 to = "/.netlify/functions/api/:splat"
  status = 200
  force = true